name: Limited Production Observation Collector

on:
  schedule:
    # JRA race-day window: Saturday/Sunday 09:00-18:59 JST.
    - cron: '*/15 0-9 * * 6,0'
  workflow_dispatch:
    inputs:
      execute:
        description: Generate prospective Production observations
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: limited-production-observation-collector
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      (github.event_name == 'schedule' && vars.LIMITED_PRODUCTION_COLLECTION_ENABLED == 'true') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION_BACKEND_HEALTH_URL: ${{ vars.PRODUCTION_BACKEND_HEALTH_URL }}
      PRODUCTION_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      PRODUCTION_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PRODUCTION_E2E_EMAIL: ${{ secrets.PRODUCTION_E2E_EMAIL }}
      PRODUCTION_E2E_PASSWORD: ${{ secrets.PRODUCTION_E2E_PASSWORD }}
      LIMITED_PRODUCTION_COLLECTION_ENABLED: ${{ vars.LIMITED_PRODUCTION_COLLECTION_ENABLED }}
      LIMITED_PRODUCTION_MAX_RACES_PER_RUN: '6'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Collect only prospective middle observations
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          execute_flag=""
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.execute }}" == "true" ]]; then
            execute_flag="--execute"
          fi
          python scripts/collect_limited_production_observations.py \
            $execute_flag \
            --output reports/limited_production_middle_collection.json

      - name: Upload sanitized collection evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: limited-production-observation-collector-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/limited_production_middle_collection.json
          if-no-files-found: error
          retention-days: 30

      - name: Notify collector failure
        if: steps.collect.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh issue comment 32 --body
          "LIMITED PRODUCTION COLLECTOR ALERT: ${RUN_URL}. Review the sanitized artifact; secrets and prediction payloads are excluded."

      - name: Fail on collection error
        if: steps.collect.outcome == 'failure'
        run: exit 1
